# Runs the TestNG smoke suite (smoke-testng.xml) on every push and pull request to main, and on demand.
# The Extent report and the log are kept as a downloadable artifact of each run.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Smoke suite (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # reuses downloaded dependencies between runs (keyed on pom.xml)

      - name: Run the tests
        run: mvn -B clean test

      # Kept even when tests fail, so failures can be analysed
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            target/extent-reports/ExtentReport.html
            log4j-application.log
          if-no-files-found: ignore

      # JUnit XML only, as its own artifact: the CI results collection of
      # automation-coverage-quality-intelligence imports it (config/producers.toml there)
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-tests
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30
